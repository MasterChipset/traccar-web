<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="${colorPrimary}" />
    <meta name="description" content="${description}" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css">
    <title>${title}</title>
    <style>
      .loader {
        position: fixed; inset: 0; margin: auto;
        width: fit-content; height: fit-content;
        font-size: 48px;
        font-weight: bold;
        letter-spacing: 2px;
        font-family: Arial, Helvetica, sans-serif;
        color: #fff;
        animation: smokeOut 1s ease-in-out infinite alternate;
        text-shadow: 0 0 1px white;
      }
      .loader:before {
        content: "Loading";
      }
      @keyframes smokeOut {
        100% {
          opacity: 0.08;
          filter: blur(5px);
          letter-spacing: 4px;
        }
      }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to use <a href="https://www.traccar.org/">Traccar GPS Tracking System</a>.</noscript>
    <div id="root" class="root"></div>
    <span class="loader"></span>
    <script type="module" src="/src/index.jsx" onerror="alert('Loading error.')"></script>
  </body>
</html>
